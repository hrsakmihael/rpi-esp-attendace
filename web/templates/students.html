<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ static_url('style.css') }}">

    <title>Kontrola pristupa</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Kontrola pristupa</a>

            <div class="navbar-nav">
                <a class="nav-link" href="/">Početna</a>
                <a class="nav-link" href="/studenti">Studenti</a>
                <a class="nav-link" href="/profesori">Profesori</a>
                <a class="nav-link" href="/predmeti">Predmeti</a>
                <a class="nav-link" href="/evidencija">Evidencija</a>
            </div>
        </div>
    </nav>


<div class="container mt-5">

    <h1>Studenti</h1>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>ID</th>
                <th>Ime i prezime</th>
                <th>RFID UID</th>
            </tr>
        </thead>

        <tbody>

            {% for student in students %}

            <tr>
                <td>{{ student["id"] }}</td>
                <td>{{ student["name"] }}</td>
                <td>{{ student["uid"] }}</td>
            </tr>

            {% end %}

        </tbody>

    </table>


    <hr class="my-5">


    <h2>Dodaj studenta</h2>

    <div class="mb-3">

        <label for="student-name" class="form-label">
            Ime i prezime
        </label>

        <input
            type="text"
            id="student-name"
            class="form-control"
            placeholder="npr. Ivan Horvat"
        >

    </div>


    <div class="mb-3">

        <label for="student-uid" class="form-label">
            RFID UID
        </label>

        <input
            type="text"
            id="student-uid"
            class="form-control"
            placeholder="npr. FF69D6FB"
        >

    </div>


    <button
        id="add-student"
        class="btn btn-primary">
        Dodaj studenta
    </button>


    <p id="message" class="mt-3"></p>

</div>


<script>

    console.log("Pokretanje WebSocketa...");

    const socket = new WebSocket(
        "ws://" + window.location.host + "/ws"
    );


    socket.onopen = function() {

        console.log("WebSocket povezan");

    };


    socket.onclose = function() {

        console.log("WebSocket zatvoren");

    };


    socket.onerror = function(error) {

        console.log("WebSocket greška:", error);

    };


    socket.onmessage = function(event) {

        console.log("Primljena poruka:", event.data);

        const response = JSON.parse(event.data);

        const message = document.getElementById("message");

        message.textContent = response.message;


        if (response.type === "success") {

            message.className = "mt-3 text-success";

            document.getElementById("student-name").value = "";
            document.getElementById("student-uid").value = "";

            setTimeout(function() {

                location.reload();

            }, 500);

        } else {

            message.className = "mt-3 text-danger";

        }

    };


    const button = document.getElementById("add-student");


    button.addEventListener("click", function() {

        console.log("Kliknut gumb Dodaj studenta");


        const name =
            document.getElementById("student-name").value.trim();


        const uid =
            document.getElementById("student-uid").value.trim();


        console.log("Ime:", name);
        console.log("UID:", uid);


        if (!name || !uid) {

            document.getElementById("message").textContent =
                "Unesite ime i RFID UID.";

            document.getElementById("message").className =
                "mt-3 text-danger";

            return;

        }


        const data = {

            type: "add_student",

            name: name,

            uid: uid

        };


        console.log("Šaljem:", data);


        socket.send(JSON.stringify(data));


        document.getElementById("message").textContent =
            "Podaci poslani serveru.";

    });

</script>


</body>
</html>
