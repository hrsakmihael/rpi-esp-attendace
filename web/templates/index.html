<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ static_url('style.css') }}">

    <title>Kontrola pristupa</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Kontrola pristupa</a>

            <div class="navbar-nav">
                <a class="nav-link" href="/">Početna</a>
                <a class="nav-link" href="/studenti">Studenti</a>
                <a class="nav-link" href="/profesori">Profesori</a>
                <a class="nav-link" href="/predmeti">Predmeti</a>
                <a class="nav-link" href="/evidencija">Evidencija</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <h1>Sustav za kontrolu pristupa</h1>

        <p>Web sučelje radi.</p>

    </div>

<div class="container mt-5">
    <h2>MQTT događaji</h2>

    <div id="mqtt-events"></div>
</div>

<script>
    const socket = new WebSocket("ws://" + window.location.host + "/ws");

    socket.onopen = function() {
        console.log("WebSocket spojen");
    };

    socket.onmessage = function(event) {
        const message = document.createElement("p");
        message.textContent = "Primljeno: " + event.data;

        document.getElementById("mqtt-events").prepend(message);
    };

    socket.onclose = function() {
        console.log("WebSocket zatvoren");
    };
</script>

</body>
</html>
