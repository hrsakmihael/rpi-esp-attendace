<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ static_url('style.css') }}">

    <title>Kontrola pristupa</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Kontrola pristupa</a>

            <div class="navbar-nav">
                <a class="nav-link" href="/">Početna</a>
                <a class="nav-link" href="/studenti">Studenti</a>
                <a class="nav-link" href="/profesori">Profesori</a>
                <a class="nav-link" href="/predmeti">Predmeti</a>
                <a class="nav-link" href="/evidencija">Evidencija</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <h1>Profesori</h1>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ime i prezime</th>
                    <th>RFID UID</th>
                </tr>
            </thead>

            <tbody>
                {% for professor in professors %}
                <tr>
                    <td>{{ professor["id"] }}</td>
                    <td>{{ professor["name"] }}</td>
                    <td>{{ professor["uid"] }}</td>
                </tr>
                {% end %}
            </tbody>
        </table>
	        </table>

        <hr class="my-5">

        <h2>Dodaj profesora</h2>

        <div class="mb-3">
            <label for="professor-name" class="form-label">
                Ime i prezime
            </label>

            <input
                type="text"
                id="professor-name"
                class="form-control"
                placeholder="npr. Ivan Horvat"
            >
        </div>

        <div class="mb-3">
            <label for="professor-uid" class="form-label">
                RFID UID
            </label>

            <input
                type="text"
                id="professor-uid"
                class="form-control"
                placeholder="npr. A177ACA4"
            >
        </div>

        <button id="add-professor" class="btn btn-primary">
            Dodaj profesora
        </button>

        <p id="message" class="mt-3"></p>

    </div>
    </div>
<script>
    const socket = new WebSocket(
        "ws://" + window.location.host + "/ws"
    );

socket.onmessage = function(event) {
    const response = JSON.parse(event.data);

    const message = document.getElementById("message");

    message.textContent = response.message;

    if (response.type === "success") {
        message.className = "mt-3 text-success";

        document.getElementById("professor-name").value = "";
        document.getElementById("professor-uid").value = "";

        setTimeout(function() {
            location.reload();
        }, 500);
    } else {
        message.className = "mt-3 text-danger";
    }
};

    const button = document.getElementById("add-professor");

    button.addEventListener("click", function() {

        const name = document.getElementById("professor-name").value.trim();
        const uid = document.getElementById("professor-uid").value.trim();

        if (!name || !uid) {
            document.getElementById("message").textContent =
                "Unesite ime i RFID UID.";
            return;
        }
 
        const data = {
            type: "add_professor",
            name: name,
            uid: uid
        };

        socket.send(JSON.stringify(data));

        document.getElementById("message").textContent =
            "Podaci poslani serveru.";
    });
</script>
</body>
</html>
