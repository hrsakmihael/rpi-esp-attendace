<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ static_url('style.css') }}">

    <title>Kontrola pristupa</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Kontrola pristupa</a>

            <div class="navbar-nav">
                <a class="nav-link" href="/">Početna</a>
                <a class="nav-link" href="/studenti">Studenti</a>
                <a class="nav-link" href="/profesori">Profesori</a>
                <a class="nav-link" href="/predmeti">Predmeti</a>
                <a class="nav-link" href="/evidencija">Evidencija</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <h1>Evidencija prisutnosti</h1>

        <div class="row mb-4">

            <div class="col-md-5">
                <label for="studentFilter" class="form-label">Student</label>
                <select id="studentFilter" class="form-select">
                    <option value="">Svi studenti</option>

                    {% set students = [] %}

                    {% for record in attendance %}
                        {% if record["student_name"] not in students %}
                            {% set students = students + [record["student_name"]] %}
                            <option value="{{ record['student_name'] }}">
                                {{ record["student_name"] }}
                            </option>
                        {% end %}
                    {% end %}
                </select>
            </div>

            <div class="col-md-5">
                <label for="courseFilter" class="form-label">Predmet</label>
                <select id="courseFilter" class="form-select">
                    <option value="">Svi predmeti</option>

                    {% set courses = [] %}

                    {% for record in attendance %}
                        {% if record["course_name"] not in courses %}
                            {% set courses = courses + [record["course_name"]] %}
                            <option value="{{ record['course_name'] }}">
                                {{ record["course_name"] }}
                            </option>
                        {% end %}
                    {% end %}
                </select>
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-secondary w-100" onclick="resetFilters()">
                    Poništi
                </button>
            </div>

        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Predmet</th>
                    <th>Vrijeme</th>
                </tr>
            </thead>

            <tbody id="attendanceTable">
                {% for record in attendance %}
                <tr>
                    <td>{{ record["id"] }}</td>
                    <td>{{ record["student_name"] }}</td>
                    <td>{{ record["course_name"] }}</td>
                    <td>{{ record["timestamp"] }}</td>
                </tr>
                {% end %}
            </tbody>
        </table>

    </div>

    <script>
        const studentFilter = document.getElementById("studentFilter");
        const courseFilter = document.getElementById("courseFilter");
        const rows = document.querySelectorAll("#attendanceTable tr");

        studentFilter.addEventListener("change", filterTable);
        courseFilter.addEventListener("change", filterTable);

        function filterTable() {

            const selectedStudent = studentFilter.value;
            const selectedCourse = courseFilter.value;

            rows.forEach(row => {

                const student = row.cells[1].textContent.trim();
                const course = row.cells[2].textContent.trim();

                const studentMatch =
                    !selectedStudent || student === selectedStudent;

                const courseMatch =
                    !selectedCourse || course === selectedCourse;

                row.style.display =
                    studentMatch && courseMatch ? "" : "none";
            });
        }

        function resetFilters() {
            studentFilter.value = "";
            courseFilter.value = "";
            filterTable();
        }
    </script>

</body>
</html>
